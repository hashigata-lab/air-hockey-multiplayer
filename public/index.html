<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>4-Player Air Hockey</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #87CEEB; 
            background-image: url('lobby_bg_yoshi.jpg');
            background-size: cover;
            background-position: center;
            color: #444; 
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            touch-action: none;
        }
        #game-container {
            display: none; /* ロビー中は隠す */
            position: relative;
        }
        #gameCanvas {
            background-color: #222; 
            border: 4px solid #444;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            max-width: 95vmin;
            max-height: 95vmin;
            display: block;
        }
        #ui { 
            position: absolute; 
            top: 10px; 
            left: 10px; 
            background: rgba(0,0,0,0.7); 
            padding: 15px; 
            border-radius: 8px; 
            pointer-events: none;
            z-index: 10;
        }

        .dancing-meme-container {
            position: absolute;
            display: none;
            width: 100px;
            height: 250px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 5;
        }
        /* キャンバス(800px)の確実な外側に配置 */
        #dancing-meme-left { left: calc(50% - 400px - 150px); }
        #dancing-meme-right { right: calc(50% - 400px - 150px); }

        .meme-head {
            position: absolute;
            top: 0; left: 0;
            width: 100px; height: 100px;
            border-radius: 50%;
            border: 4px solid #00ffff;
            box-shadow: 0 0 10px #00ffff;
            overflow: hidden;
            z-index: 2;
        }
        .meme-head img {
            width: 100%; height: 100%; object-fit: cover;
        }
        .meme-body {
            position: absolute;
            top: 100px; left: 45px;
            width: 10px; height: 80px;
            background: #00ffff;
            border-radius: 5px;
            box-shadow: 0 0 10px #00ffff;
        }
        .meme-arm, .meme-leg {
            position: absolute;
            width: 10px; height: 60px;
            background: #00ffff;
            border-radius: 5px;
            box-shadow: 0 0 10px #00ffff;
            transform-origin: top center;
        }
        .meme-arm { top: 110px; }
        .meme-arm-left { left: 45px; transform: rotate(30deg); }
        .meme-arm-right { left: 45px; transform: rotate(-30deg); }
        .meme-leg { top: 175px; }
        .meme-leg-left { left: 45px; transform: rotate(20deg); }
        .meme-leg-right { left: 45px; transform: rotate(-20deg); }
        h3 { margin: 0 0 10px 0; }
        p { margin: 5px 0; font-size: 14px; }
        
        .neon-input:focus {
    outline: none;
    border-color: #00ffff;
    box-shadow: 0 0 10px #00ffff;
}

/* Lobby Screen UI */
#lobby, #lobby-screen {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(10px);
    padding: 30px;
    border-radius: 24px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2), inset 0 0 0 4px rgba(255,255,255,1);
    text-align: center;
    z-index: 100;
    border: 4px solid #FFB6C1;
    color: #444;
}
#lobby-screen {
    max-width: 600px;
    width: 90%;
    max-height: 95vh;
    overflow-y: auto;
}
#lobby h1, #lobby-screen h1, #lobby h2, #lobby-screen h2, #lobby h3, #lobby-screen h3 {
    color: #FF69B4;
    text-shadow: 2px 2px 0px #fff, 3px 3px 0px rgba(0,0,0,0.1);
    margin-top: 0;
}
#lobby h2 {
    font-size: 32px;
}
#lobby input {
    display: block;
    width: 100%;
    margin: 10px 0;
    padding: 12px;
    box-sizing: border-box;
    background: rgba(255, 255, 255, 0.9);
    color: #333;
    border: 3px solid #87CEFA;
    border-radius: 12px;
    font-size: 16px;
    font-family: inherit;
    font-weight: bold;
}
#lobby input:focus {
    outline: none;
    border-color: #FF69B4;
    box-shadow: 0 0 10px rgba(255,105,180,0.5);
}
#lobby button, #lobby-screen button {
    padding: 12px 24px;
    margin: 10px 5px;
    background: #32CD32;
    color: #fff;
    border: 3px solid #228B22;
    border-radius: 16px;
    cursor: pointer;
    font-size: 18px;
    font-weight: bold;
    font-family: inherit;
    box-shadow: 0 4px 0 #228B22;
    transition: all 0.1s;
}
#lobby button:hover, #lobby-screen button:hover {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #228B22;
    background: #3cb371;
}
#lobby button:active, #lobby-screen button:active {
    transform: translateY(4px);
    box-shadow: 0 0 0 #228B22;
}
#btn-start-game:disabled {
    background: #ccc !important;
    color: #888 !important;
    border-color: #aaa !important;
    box-shadow: none !important;
    transform: none !important;
    cursor: not-allowed;
}
.player-list-container, .stage-selection-container, .skin-selection-container {
    margin: 20px 0;
    text-align: left;
    background: rgba(255, 255, 255, 0.5);
    border-radius: 12px;
    padding: 15px;
    border: 2px dashed #FFB6C1;
}
#lobby-player-list {
    list-style: none;
    padding: 0;
    margin: 10px 0;
}
#lobby-player-list li {
    padding: 8px 10px;
    margin-bottom: 5px;
    background: rgba(255, 255, 255, 0.8);
    border-radius: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 1.1em;
    font-weight: bold;
    color: #333;
    border: 1px solid #ddd;
}
.stage-options, .skin-options, .size-options {
    display: flex;
    justify-content: space-between;
    gap: 10px;
}
.stage-option, .skin-option, .size-option {
    flex: 1;
    cursor: pointer;
    text-align: center;
    border: 3px solid transparent;
    border-radius: 12px;
    padding: 5px;
    transition: 0.2s;
    background: rgba(255,255,255,0.6);
}
.stage-option:hover, .skin-option:hover, .size-option:hover {
    background: rgba(255,255,255,1);
    transform: translateY(-2px);
}
.stage-option.selected, .skin-option.selected, .size-option.selected {
    border-color: #32CD32;
    background: rgba(50, 205, 50, 0.2);
}
.stage-option img, .skin-option img, .skin-option .default-skin {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    border-radius: 8px;
    display: block;
    margin-bottom: 5px;
}
.skin-option img, .skin-option .default-skin {
    border-radius: 50%;
    background: #ddd;
}
.stage-option span, .skin-option span, .size-option span {
    font-size: 0.9em;
    display: block;
    font-weight: bold;
    color: #444;
}
.size-option-title {
    font-size: 24px;
    font-weight: bold;
    padding: 15px 0 5px 0;
    color: #FF69B4;
}

        #btn-mute {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0,0,0,0.7);
            border: 2px solid #555;
            color: #fff;
            font-size: 24px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 200;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.2s;
        }
        #btn-mute:hover {
            background: rgba(255,255,255,0.2);
            border-color: #fff;
        }
        #btn-mute.muted {
            color: #ff4444;
            border-color: #ff4444;
        }

        #btn-options {
            position: absolute;
            top: 15px;
            right: 75px;
            background: rgba(0,0,0,0.7);
            border: 2px solid #555;
            color: #fff;
            font-size: 24px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 200;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.2s;
        }
        #btn-options:hover {
            background: rgba(255,255,255,0.2);
            border-color: #fff;
        }

        #options-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .options-content {
            background: #222;
            padding: 30px;
            border-radius: 8px;
            border: 2px solid #00ffff;
            box-shadow: 0 0 15px #00ffff;
            color: #fff;
            width: 300px;
            text-align: center;
        }
        .options-content h2 {
            margin-top: 0;
            color: #00ffff;
        }
        .slider-group {
            margin: 20px 0;
            text-align: left;
        }
        .slider-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .slider-group input[type=range] {
            width: 100%;
            cursor: pointer;
        }
        #btn-close-options {
            padding: 10px 20px;
            background: #ff4444;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
        }
        #btn-close-options:hover {
            background: #ff6666;
        }

        #chat-container {
            display: none;
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 300px;
            height: 200px;
            background: rgba(0,0,0,0.8);
            border: 1px solid #444;
            border-radius: 8px;
            flex-direction: column;
            z-index: 20;
        }
        #chat-messages {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
            font-size: 14px;
        }
        #chat-input-container {
            display: flex;
            border-top: 1px solid #444;
        }
        #chat-input {
            flex-grow: 1;
            background: #222;
            color: #fff;
            border: none;
            padding: 8px;
            outline: none;
            border-bottom-left-radius: 8px;
        }
        #chat-send {
            background: #444;
            color: #fff;
            border: none;
            padding: 0 15px;
            cursor: pointer;
            border-bottom-right-radius: 8px;
        }
        #chat-send:hover { background: #555; }
        
        #gameover-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #gameover-title {
            font-size: 60px;
            color: #00ffff;
            text-shadow: 0 0 20px #00ffff;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 5px;
        }
        .btn-gameover {
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin: 0 10px;
            background: rgba(0,0,0,0.5);
            transition: 0.2s;
        }
        #btn-restart {
            color: #00ff00;
            border: 2px solid #00ff00;
            box-shadow: 0 0 10px #00ff00;
        }
        #btn-restart:hover { background: rgba(0,255,0,0.2); }
        
        #btn-return-lobby {
            color: #ff0055;
            border: 2px solid #ff0055;
            box-shadow: 0 0 10px #ff0055;
        }
        #btn-return-lobby:hover { background: rgba(255,0,85,0.2); }
    </style>
</head>
<body>
    <button id="btn-mute">🎵</button>
    <button id="btn-options">⚙️</button>

    <div id="options-modal">
        <div class="options-content">
            <h2>Options</h2>
            <div class="slider-group">
                <label for="bgm-volume">BGM Volume</label>
                <input type="range" id="bgm-volume" min="0" max="1" step="0.01" value="0.4">
            </div>
            <div class="slider-group">
                <label for="se-volume">SE Volume</label>
                <input type="range" id="se-volume" min="0" max="1" step="0.01" value="1.0">
            </div>
            <button id="btn-close-options">Close</button>
        </div>
    </div>

    <div id="lobby">
        <h2>Air Hockey</h2>
        <input type="text" id="playerName" placeholder="Your Name" maxlength="15">
        <input type="text" id="roomIdInput" placeholder="Room ID (Leave empty to create)">
        <div>
            <button id="btnCreateRoom">Create Room</button>
            <button id="btnJoinRoom">Join Room</button>
        </div>
    </div>

    <!-- Waiting Room Lobby -->
    <div id="lobby-screen" style="display: none;">
        <h1>LOBBY</h1>
        <h2>Room ID: <span id="lobby-room-id" style="color: #32CD32;"></span></h2>
        <div class="player-list-container">
            <h3>Players (<span id="lobby-player-count">0</span>/4)</h3>
            <ul id="lobby-player-list">
                <!-- Populated by JS -->
            </ul>
        </div>
        
        <div class="stage-selection-container">
            <h3 style="margin-bottom: 10px;">Select Stage Size</h3>
            <div class="size-options" id="size-options">
                <div class="size-option" data-size="600">
                    <div class="size-option-title">Small</div>
                    <span>600 x 600</span>
                </div>
                <div class="size-option selected" data-size="800">
                    <div class="size-option-title">Medium</div>
                    <span>800 x 800</span>
                </div>
                <div class="size-option" data-size="1000">
                    <div class="size-option-title">Large</div>
                    <span>1000 x 1000</span>
                </div>
            </div>
        </div>

        <div class="stage-selection-container">
            <h3 style="margin-bottom: 10px;">Select Stage Theme</h3>
            <div class="stage-options" id="stage-options">
                <div class="stage-option selected" data-stage="CYBERPUNK">
                    <img src="assets/bg_cyberpunk.jpg" alt="Cyberpunk">
                    <span>Cyberpunk</span>
                </div>
                <div class="stage-option" data-stage="RETRO">
                    <img src="assets/bg_retro.jpg" alt="Retro">
                    <span>Retro Arcade</span>
                </div>
                <div class="stage-option" data-stage="ICE">
                    <img src="assets/bg_ice.jpg" alt="Ice">
                    <span>Fantasy Ice</span>
                </div>
            </div>
        </div>

        <div class="skin-selection-container">
            <h3 style="margin-bottom: 10px;">Select Your Skin</h3>
            <div class="skin-options" id="skin-options">
                <div class="skin-option selected" data-skin="DEFAULT">
                    <div class="default-skin"></div>
                    <span>Default</span>
                </div>
                <div class="skin-option" data-skin="DOGE">
                    <img src="assets/skin_doge.jpg" alt="Doge">
                    <span>Doge</span>
                </div>
                <div class="skin-option" data-skin="CAT">
                    <img src="assets/skin_cat.jpg" alt="Crying Cat">
                    <span>Crying Cat</span>
                </div>
                <div class="skin-option" data-skin="FROG">
                    <img src="assets/skin_frog.jpg" alt="Smug Frog">
                    <span>Smug Frog</span>
                </div>
            </div>
        </div>

        <button id="btn-start-game" disabled style="padding: 15px 30px; font-size: 18px; font-weight: bold; background: #00ff00; color: #000; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px;">Start Game</button>
    </div>

    <div id="game-container">
        <div id="dancing-meme-left" class="dancing-meme-container">
            <div class="meme-head"><img src="assets/skin_doge.jpg" alt="Doge"></div>
            <div class="meme-body"></div>
            <div class="meme-arm meme-arm-left"></div>
            <div class="meme-arm meme-arm-right"></div>
            <div class="meme-leg meme-leg-left"></div>
            <div class="meme-leg meme-leg-right"></div>
        </div>
        <div id="dancing-meme-right" class="dancing-meme-container">
            <div class="meme-head"><img src="assets/skin_cat.jpg" alt="Cat"></div>
            <div class="meme-body"></div>
            <div class="meme-arm meme-arm-left"></div>
            <div class="meme-arm meme-arm-right"></div>
            <div class="meme-leg meme-leg-left"></div>
            <div class="meme-leg meme-leg-right"></div>
        </div>
        <div id="ui">
            <h3>Air Hockey</h3>
            <p id="status">Connecting...</p>
            <p id="debug-info"></p>
        </div>
        <canvas id="gameCanvas" width="800" height="800"></canvas>
        <div id="gameover-overlay">
            <h2 id="gameover-title">WINNER: P1</h2>
            <div>
                <button id="btn-restart" class="btn-gameover">Restart Game</button>
                <button id="btn-return-lobby" class="btn-gameover">Return to Lobby</button>
            </div>
        </div>
    </div>

    <div id="chat-container">
        <div id="chat-messages"></div>
        <div id="chat-input-container">
            <input type="text" id="chat-input" placeholder="Chat message...">
            <button id="chat-send">Send</button>
        </div>
    </div>
    
    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
