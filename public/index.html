<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>4-Player Air Hockey</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #111; 
            color: #fff; 
            font-family: sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            touch-action: none;
        }
        #game-container {
            display: none; /* ロビー中は隠す */
            position: relative;
        }
        #gameCanvas {
            background-color: #222; 
            border: 4px solid #444;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            max-width: 95vmin;
            max-height: 95vmin;
            display: block;
        }
        #ui { 
            position: absolute; 
            top: 10px; 
            left: 10px; 
            background: rgba(0,0,0,0.7); 
            padding: 15px; 
            border-radius: 8px; 
            pointer-events: none;
            z-index: 10;
        }
        h3 { margin: 0 0 10px 0; }
        p { margin: 5px 0; font-size: 14px; }
        
        .neon-input:focus {
    outline: none;
    border-color: #00ffff;
    box-shadow: 0 0 10px #00ffff;
}

/* Lobby Screen UI */
#lobby-screen {
    background: #222;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 0 20px rgba(0,0,0,0.8);
    text-align: center;
    z-index: 100;
    max-width: 600px;
    width: 90%;
    max-height: 95vh;
    overflow-y: auto;
}
.player-list-container {
    margin: 20px 0;
    text-align: left;
    background: rgba(0,0,0,0.3);
    border-radius: 8px;
    padding: 15px;
}
#lobby-player-list {
    list-style: none;
    padding: 0;
    margin: 10px 0;
}
#lobby-player-list li {
    padding: 8px 10px;
    margin-bottom: 5px;
    background: rgba(255,255,255,0.1);
    border-radius: 4px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 1.1em;
}
#btn-start-game:disabled {
    background: #555;
    cursor: not-allowed;
    opacity: 0.6;
}

/* Stage Selection */
.stage-selection-container {
    margin: 20px 0;
    text-align: left;
    background: rgba(0,0,0,0.3);
    border-radius: 8px;
    padding: 15px;
}
.stage-options {
    display: flex;
    justify-content: space-between;
    gap: 10px;
}
.stage-option {
    flex: 1;
    cursor: pointer;
    text-align: center;
    border: 2px solid transparent;
    border-radius: 8px;
    padding: 5px;
    transition: 0.2s;
}
.stage-option:hover {
    background: rgba(255,255,255,0.1);
}
.stage-option.selected {
    border-color: #00ffff;
    background: rgba(0, 255, 255, 0.2);
}
.stage-option img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    border-radius: 4px;
    display: block;
    margin-bottom: 5px;
}
.stage-option span {
    font-size: 0.8em;
    display: block;
}

/* Skin Selection */
.skin-selection-container {
    margin: 20px 0;
    text-align: left;
    background: rgba(0,0,0,0.3);
    border-radius: 8px;
    padding: 15px;
}
.skin-options {
    display: flex;
    justify-content: space-between;
    gap: 10px;
}
.skin-option {
    flex: 1;
    cursor: pointer;
    text-align: center;
    border: 2px solid transparent;
    border-radius: 8px;
    padding: 5px;
    transition: 0.2s;
}
.skin-option:hover {
    background: rgba(255,255,255,0.1);
}
.skin-option.selected {
    border-color: #ff00ff;
    background: rgba(255, 0, 255, 0.2);
}
.skin-option img, .skin-option .default-skin {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    border-radius: 50%;
    display: block;
    margin-bottom: 5px;
    background: #555;
}
.skin-option span {
    font-size: 0.8em;
    display: block;
}

#lobby {
            background: #222;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            text-align: center;
            z-index: 100;
        }
        #lobby input {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 10px;
            box-sizing: border-box;
            background: #333;
            color: #fff;
            border: 1px solid #555;
            border-radius: 4px;
        }
        #lobby button {
            padding: 10px 20px;
            margin: 10px 5px;
            background: #4444ff;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        #lobby button:hover {
            background: #6666ff;
        }

        #chat-container {
            display: none;
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 300px;
            height: 200px;
            background: rgba(0,0,0,0.8);
            border: 1px solid #444;
            border-radius: 8px;
            flex-direction: column;
            z-index: 20;
        }
        #chat-messages {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
            font-size: 14px;
        }
        #chat-input-container {
            display: flex;
            border-top: 1px solid #444;
        }
        #chat-input {
            flex-grow: 1;
            background: #222;
            color: #fff;
            border: none;
            padding: 8px;
            outline: none;
            border-bottom-left-radius: 8px;
        }
        #chat-send {
            background: #444;
            color: #fff;
            border: none;
            padding: 0 15px;
            cursor: pointer;
            border-bottom-right-radius: 8px;
        }
        #chat-send:hover { background: #555; }
    </style>
</head>
<body>
    <div id="lobby">
        <h2>Air Hockey</h2>
        <input type="text" id="playerName" placeholder="Your Name" maxlength="15">
        <input type="text" id="roomIdInput" placeholder="Room ID (Leave empty to create)">
        <div>
            <button id="btnCreateRoom">Create Room</button>
            <button id="btnJoinRoom">Join Room</button>
        </div>
    </div>

    <!-- Waiting Room Lobby -->
    <div id="lobby-screen" style="display: none;">
        <h1 style="color: #00ffff; margin-top: 0;">LOBBY</h1>
        <h2>Room ID: <span id="lobby-room-id" style="color: #ffff00;"></span></h2>
        <div class="player-list-container">
            <h3>Players (<span id="lobby-player-count">0</span>/4)</h3>
            <ul id="lobby-player-list">
                <!-- Populated by JS -->
            </ul>
        </div>
        
        <div class="stage-selection-container">
            <h3 style="margin-bottom: 10px;">Select Stage</h3>
            <div class="stage-options" id="stage-options">
                <div class="stage-option selected" data-stage="CYBERPUNK">
                    <img src="assets/bg_cyberpunk.jpg" alt="Cyberpunk">
                    <span>Cyberpunk</span>
                </div>
                <div class="stage-option" data-stage="RETRO">
                    <img src="assets/bg_retro.jpg" alt="Retro">
                    <span>Retro Arcade</span>
                </div>
                <div class="stage-option" data-stage="ICE">
                    <img src="assets/bg_ice.jpg" alt="Ice">
                    <span>Fantasy Ice</span>
                </div>
            </div>
        </div>

        <div class="skin-selection-container">
            <h3 style="margin-bottom: 10px;">Select Your Skin</h3>
            <div class="skin-options" id="skin-options">
                <div class="skin-option selected" data-skin="DEFAULT">
                    <div class="default-skin"></div>
                    <span>Default</span>
                </div>
                <div class="skin-option" data-skin="DOGE">
                    <img src="assets/skin_doge.jpg" alt="Doge">
                    <span>Doge</span>
                </div>
                <div class="skin-option" data-skin="CAT">
                    <img src="assets/skin_cat.jpg" alt="Crying Cat">
                    <span>Crying Cat</span>
                </div>
                <div class="skin-option" data-skin="FROG">
                    <img src="assets/skin_frog.jpg" alt="Smug Frog">
                    <span>Smug Frog</span>
                </div>
            </div>
        </div>

        <button id="btn-start-game" disabled style="padding: 15px 30px; font-size: 18px; font-weight: bold; background: #00ff00; color: #000; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px;">Start Game</button>
    </div>

    <div id="game-container">
        <div id="ui">
            <h3>Air Hockey</h3>
            <p id="status">Connecting...</p>
            <p id="debug-info">-</p>
        </div>
        <canvas id="gameCanvas" width="800" height="800"></canvas>
    </div>

    <div id="chat-container">
        <div id="chat-messages"></div>
        <div id="chat-input-container">
            <input type="text" id="chat-input" placeholder="Chat message...">
            <button id="chat-send">Send</button>
        </div>
    </div>
    
    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
